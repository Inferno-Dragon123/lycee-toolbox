name: Sync official decks
on:
  workflow_dispatch:
  schedule:
    - cron: '20 20 * * *'
permissions:
  contents: read
concurrency:
  group: official-deck-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Incrementally sync official decks
        run: npm run decks:sync -- --limit 60 --pages 3
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.COMMUNITY_SYNC_DATABASE_URL }}
