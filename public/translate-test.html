<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻译测试工具 - Lycee Toolbox</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card h2 {
            color: #667eea;
            margin-bottom: 16px;
            font-size: 1.3rem;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
        }
        textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        input[type="number"]:focus, input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .param-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.3s;
            width: 100%;
        }
        .btn:hover {
            background: #5568d3;
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #764ba2;
        }
        .btn-secondary:hover {
            background: #654390;
        }
        .result {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
            min-height: 100px;
            border: 2px solid #e0e0e0;
        }
        .loading {
            color: #667eea;
            font-weight: 600;
        }
        .error {
            color: #c00;
            background: #fee;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 12px;
            padding: 12px;
            background: #f0f4fa;
            border-radius: 8px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
        }
        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #667eea;
        }
        .help-text {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .preset-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .btn-preset {
            flex: 1;
            padding: 8px;
            background: #f0f4fa;
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        .btn-preset:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 翻译测试工具</h1>

        <div class="grid">
            <!-- 左侧：输入和参数 -->
            <div>
                <div class="card">
                    <h2>📝 输入文本</h2>
                    <div class="form-group">
                        <label>日文原文:</label>
                        <textarea id="inputText" placeholder="输入日文卡牌效果...&#10;&#10;例如：&#10;[諸神々への祈り]&#10;【宣言】（ｺｽﾄ：このｷｬﾗをﾀﾞｳﾝする）：目標のあなたのｷｬﾗ１体を選ぶ。次の相手ﾀｰﾝの終了時まで、そのｷｬﾗの能力すべてを無効にする。"></textarea>
                    </div>
                    <div class="form-group">
                        <label>卡牌代码（可选，用于缓存）:</label>
                        <input type="text" id="cardCode" placeholder="例如：LO-6666">
                    </div>
                </div>

                <div class="card">
                    <h2>⚙️ 模型参数</h2>
                    <div class="preset-buttons">
                        <button class="btn-preset" onclick="setPreset('accurate')">精确模式</button>
                        <button class="btn-preset" onclick="setPreset('balanced')">平衡模式</button>
                        <button class="btn-preset" onclick="setPreset('creative')">创意模式</button>
                    </div>
                    <div class="param-grid">
                        <div class="form-group">
                            <label>Temperature (0-2):</label>
                            <input type="number" id="temperature" value="0.3" min="0" max="2" step="0.1">
                            <div class="help-text">越低越稳定，越高越创意</div>
                        </div>
                        <div class="form-group">
                            <label>Max Tokens:</label>
                            <input type="number" id="maxTokens" value="1500" min="100" max="4000" step="100">
                            <div class="help-text">最大输出长度</div>
                        </div>
                        <div class="form-group">
                            <label>Top P (0-1):</label>
                            <input type="number" id="topP" value="0.95" min="0" max="1" step="0.05">
                            <div class="help-text">采样多样性</div>
                        </div>
                        <div class="form-group">
                            <label>Frequency Penalty (0-2):</label>
                            <input type="number" id="frequencyPenalty" value="0" min="0" max="2" step="0.1">
                            <div class="help-text">减少重复词</div>
                        </div>
                    </div>
                    <div class="form-group" style="margin-top:16px;">
                        <label>
                            <input type="checkbox" id="useCache"> 使用缓存（如果有）
                        </label>
                    </div>
                </div>
            </div>

            <!-- 右侧：结果 -->
            <div>
                <div class="card">
                    <h2>✨ 翻译结果</h2>
                    <div class="result" id="result">点击"开始翻译"查看结果...</div>
                    <div id="stats" style="display:none;" class="stats">
                        <div class="stat-item">
                            <div class="stat-label">耗时</div>
                            <div class="stat-value" id="statTime">-</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">缓存</div>
                            <div class="stat-value" id="statCache">-</div>
                        </div>
                    </div>
                    <div id="error" class="error" style="display:none;"></div>
                    <button class="btn" id="translateBtn" onclick="translate()" style="margin-top:16px;">🚀 开始翻译</button>
                </div>

                <div class="card">
                    <h2>📋 快速测试</h2>
                    <button class="btn btn-secondary" onclick="loadSample(1)" style="margin-bottom:8px;">示例1: 宣言效果</button>
                    <button class="btn btn-secondary" onclick="loadSample(2)" style="margin-bottom:8px;">示例2: 复杂连锁</button>
                    <button class="btn btn-secondary" onclick="loadSample(3)">示例3: 简短效果</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const samples = {
            1: {
                text: '[諸神々への祈り]\n【宣言】（ｺｽﾄ：このｷｬﾗをﾀﾞｳﾝする）：目標のあなたのｷｬﾗ１体を選ぶ。次の相手ﾀｰﾝの終了時まで、そのｷｬﾗの能力すべてを無効にする。',
                code: 'TEST-001'
            },
            2: {
                text: '[雪月花]\n【誘発】(ｺｽﾄ：このｷｬﾗをﾀﾞｳﾝする)：あなたが登場したｷｬﾗ１体は次の相手ﾀｰﾝの終了時まで、AP+2/DP+2/SP+2を得る。さらにあなたの控え室のｷｬﾗ１体を目標として選んでもよい。その場合、そのｷｬﾗを登場させる。',
                code: 'TEST-002'
            },
            3: {
                text: '【自動α】：このｷｬﾗがｵｰﾀﾞｰｴﾘｱに登場した場合、相手のｷｬﾗ１体をﾀﾞｳﾝする。',
                code: 'TEST-003'
            }
        };

        function loadSample(id) {
            document.getElementById('inputText').value = samples[id].text;
            document.getElementById('cardCode').value = samples[id].code;
        }

        function setPreset(mode) {
            if (mode === 'accurate') {
                document.getElementById('temperature').value = 0.1;
                document.getElementById('topP').value = 0.9;
                document.getElementById('frequencyPenalty').value = 0;
            } else if (mode === 'balanced') {
                document.getElementById('temperature').value = 0.3;
                document.getElementById('topP').value = 0.95;
                document.getElementById('frequencyPenalty').value = 0;
            } else if (mode === 'creative') {
                document.getElementById('temperature').value = 0.7;
                document.getElementById('topP').value = 1.0;
                document.getElementById('frequencyPenalty').value = 0.3;
            }
        }

        async function translate() {
            const inputText = document.getElementById('inputText').value.trim();
            if (!inputText) {
                alert('请输入日文原文');
                return;
            }

            const btn = document.getElementById('translateBtn');
            const result = document.getElementById('result');
            const error = document.getElementById('error');
            const stats = document.getElementById('stats');

            btn.disabled = true;
            btn.textContent = '翻译中...';
            result.textContent = '正在调用 DeepSeek API...';
            result.className = 'result loading';
            error.style.display = 'none';
            stats.style.display = 'none';

            const startTime = Date.now();

            try {
                const params = {
                    text: inputText,
                    code: document.getElementById('cardCode').value.trim() || undefined,
                    temperature: parseFloat(document.getElementById('temperature').value),
                    maxTokens: parseInt(document.getElementById('maxTokens').value),
                    topP: parseFloat(document.getElementById('topP').value),
                    frequencyPenalty: parseFloat(document.getElementById('frequencyPenalty').value),
                    useCache: document.getElementById('useCache').checked
                };

                const resp = await fetch('/api/translate-test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(params)
                });

                if (!resp.ok) {
                    const errData = await resp.json().catch(() => ({}));
                    throw new Error(errData.error || `HTTP ${resp.status}`);
                }

                const data = await resp.json();
                const elapsed = Date.now() - startTime;

                result.textContent = data.translatedText || '(无结果)';
                result.className = 'result';

                document.getElementById('statTime').textContent = elapsed + 'ms';
                document.getElementById('statCache').textContent = data.fromCache ? '✅ 命中' : '❌ 新翻译';
                stats.style.display = 'flex';

            } catch (e) {
                result.textContent = '翻译失败';
                result.className = 'result';
                error.textContent = '错误: ' + e.message;
                error.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = '🚀 开始翻译';
            }
        }

        // 回车键提交
        document.getElementById('inputText').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                translate();
            }
        });
    </script>
</body>
</html>
